<!DOCTYPE html>
<html>
<head>

    <title>My Media Hub</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
          rel="stylesheet">

    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>

</head>

<body>

    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/PMPyBqofHd8"
        title="YouTube video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>


    <h2>Local Video</h2>

    <video width="560" controls>

        <source src="videoplayback.mp4" type="video/mp4">

        Your browser does not support the video tag.

    </video>


    <h2>Audio</h2>

    <audio controls>

        <source src="audio.mp3" type="audio/mpeg">

        Your browser does not support the audio element.

    </audio>


    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&output=embed"
        width="600"
        height="450"
        style="border:0;"
        loading="lazy">
    </iframe>


    <h2>External Webpage</h2>

    <iframe
        src="https://app.programiz.pro/catalog?language=java"
        width="600"
        height="400">
    </iframe>


    <h2>PDF Document</h2>

    <embed
        src="https://www.orimi.com/pdf-test.pdf"
        type="application/pdf"
        width="600"
        height="500">

</body>
</html>
